name: Student Registration Test

on:
    push:
    pull_request:

jobs:
  test-html:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run HTML Tests
        run: python test.py