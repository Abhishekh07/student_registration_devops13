name: Student Registration Test

on:
  push:
  pull_request:

jobs:
  test-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test HTML File
        run: |
          echo "Checking index.html..."

          test -f index.html || {
            echo "ERROR: index.html not found"
            exit 1
          }

          grep -q "<html" index.html || {
            echo "ERROR: <html> tag missing"
            exit 1
          }

          grep -q "<form" index.html || {
            echo "ERROR: <form> tag missing"
            exit 1
          }

          grep -q "<input" index.html || {
            echo "ERROR: <input> tag missing"
            exit 1
          }

          grep -q "<select" index.html || {
            echo "ERROR: <select> tag missing"
            exit 1
          }

          grep -q "<textarea" index.html || {
            echo "ERROR: <textarea> tag missing"
            exit 1
          }

          grep -q "<button" index.html || {
            echo "ERROR: <button> tag missing"
            exit 1
          }

          echo "=============================="
          echo "ALL HTML TESTS PASSED"
          echo "=============================="