<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CampusConnect - Student Registration</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #4f46e5, #9333ea);
        padding: 40px 20px;
    }

    .container {
        max-width: 850px;
        margin: auto;
        background: white;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .header {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        text-align: center;
        padding: 35px;
    }

    .header h1 {
        font-size: 32px;
        margin-bottom: 10px;
    }

    .header p {
        color: #e0e7ff;
    }

    form {
        padding: 35px;
    }

    .section-title {
        color: #4338ca;
        margin-bottom: 20px;
        border-bottom: 2px solid #e5e7eb;
        padding-bottom: 10px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .full-width {
        grid-column: 1 / -1;
    }

    label {
        font-weight: bold;
        margin-bottom: 8px;
        color: #374151;
    }

    input,
    select,
    textarea {
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    textarea {
        min-height: 100px;
        resize: vertical;
    }

    .interests {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    .interest {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .interest input {
        width: auto;
    }

    .button-area {
        text-align: center;
        margin-top: 20px;
    }

    button {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        border: none;
        padding: 14px 45px;
        border-radius: 30px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
    }

    .footer {
        text-align: center;
        padding: 18px;
        background: #f3f4f6;
        color: #6b7280;
        font-size: 13px;
    }

    #successMessage {
        display: none;
        margin-top: 20px;
        padding: 15px;
        border-radius: 8px;
        background: #dcfce7;
        color: #166534;
        text-align: center;
        font-weight: bold;
    }

    @media (max-width: 650px) {
        .form-grid {
            grid-template-columns: 1fr;
        }

        .full-width {
            grid-column: auto;
        }
    }
</style>

</head> <body> <div class="container">
<div class="header">
    <h1>🎓 CampusConnect</h1>
    <p>Student Registration Portal</p>
</div>

<form id="registrationForm">

    <h2 class="section-title">👤 Personal Information</h2>

    <div class="form-grid">

        <div class="form-group">
            <label for="firstName">First Name *</label>
            <input type="text"
                   id="firstName"
                   name="firstName"
                   placeholder="Enter first name"
                   required>
        </div>

        <div class="form-group">
            <label for="lastName">Last Name *</label>
            <input type="text"
                   id="lastName"
                   name="lastName"
                   placeholder="Enter last name"
                   required>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="student@example.com"
                   required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel"
                   id="phone"
                   name="phone"
                   placeholder="+91 9876543210"
                   required>
        </div>

        <div class="form-group">
            <label for="dob">Date of Birth *</label>
            <input type="date"
                   id="dob"
                   name="dob"
                   required>
        </div>

        <div class="form-group">
            <label for="gender">Gender *</label>
            <select id="gender"
                    name="gender"
                    required>

                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>

    </div>

    <h2 class="section-title">📚 Academic Information</h2>

    <div class="form-grid">

        <div class="form-group">
            <label for="studentId">Student ID *</label>
            <input type="text"
                   id="studentId"
                   name="studentId"
                   placeholder="STU2026001"
                   required>
        </div>

        <div class="form-group">
            <label for="course">Course *</label>

            <select id="course"
                    name="course"
                    required>

                <option value="">Select Course</option>
                <option value="bca">BCA</option>
                <option value="btech">B.Tech</option>
                <option value="mca">MCA</option>
                <option value="mba">MBA</option>
                <option value="bsc">B.Sc</option>

            </select>
        </div>

        <div class="form-group full-width">

            <label>Interests</label>

            <div class="interests">

                <label class="interest">
                    <input type="checkbox"
                           name="interest"
                           value="coding">
                    Coding
                </label>

                <label class="interest">
                    <input type="checkbox"
                           name="interest"
                           value="sports">
                    Sports
                </label>

                <label class="interest">
                    <input type="checkbox"
                           name="interest"
                           value="music">
                    Music
                </label>

                <label class="interest">
                    <input type="checkbox"
                           name="interest"
                           value="design">
                    Design
                </label>

            </div>

        </div>

    </div>

    <h2 class="section-title">📍 Contact Information</h2>

    <div class="form-grid">

        <div class="form-group full-width">

            <label for="address">Address *</label>

            <textarea id="address"
                      name="address"
                      placeholder="Enter your complete address"
                      required></textarea>

        </div>

    </div>

    <div class="button-area">

        <button type="submit">
            🚀 Register Student
        </button>

        <div id="successMessage">
            🎉 Registration submitted successfully!
        </div>

    </div>

</form>

<div class="footer">
    CampusConnect © 2026 | DevOps Program 10
</div>

</div> <script> document .getElementById("registrationForm") .addEventListener("submit", function(event) { event.preventDefault(); document.getElementById("successMessage").style.display = "block"; }); </script> 
</body> 
</html>
